name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Run the core suite
        run: |
          set -o pipefail
          ./gradlew :core:test --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: Save the log where it can be read
        if: failure()
        uses: ./.github/actions/publish-log
        with:
          name: core

  build:
    name: Debug build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build the native pieces
        run: |
          set -o pipefail
          ./scripts/fetch-native.sh 2>&1 | tee build-log.txt

      - name: Both libraries are present for every ABI
        run: |
          missing=0
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libxray.so libhev-socks5-tunnel.so; do
              path="app/src/main/jniLibs/$abi/$lib"
              if [ ! -s "$path" ]; then
                echo "missing $path"
                missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Assemble
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: Save the log where it can be read
        if: failure()
        uses: ./.github/actions/publish-log
        with:
          name: build
