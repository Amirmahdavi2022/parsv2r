name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run the core suite
        run: ./gradlew :core:test --no-daemon
      - name: Upload the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test

  build:
    name: Debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build the native pieces
        run: ./scripts/fetch-native.sh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}

      - name: Both libraries are present for every ABI
        run: |
          missing=0
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libxray.so libhev-socks5-tunnel.so; do
              path="app/src/main/jniLibs/$abi/$lib"
              if [ ! -s "$path" ]; then
                echo "missing $path"
                missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Assemble
        run: ./gradlew :app:assembleDebug --no-daemon
