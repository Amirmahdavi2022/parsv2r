name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish as (leave empty to build artifacts only)'
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: gradle/actions/setup-gradle@v4

      - name: Core checks
        run: |
          set -o pipefail
          ./gradlew :core:test --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: Build the native pieces
        run: |
          set -o pipefail
          ./scripts/fetch-native.sh 2>&1 | tee build-log.txt
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}

      - name: Both libraries are present for every ABI
        run: |
          missing=0
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libxray.so libhev-socks5-tunnel.so; do
              path="app/src/main/jniLibs/$abi/$lib"
              if [ ! -s "$path" ]; then
                echo "missing $path"
                missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Decode the signing key
        # No `if:` on a step env var here -- the condition is evaluated before the step's own env
        # block exists, so it would always read empty and the key would never be decoded. The
        # shell does the check instead, where the value actually is.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No signing key is configured; the build will be unsigned." >&2
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "The keystore secret did not decode to anything." >&2
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Assemble release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: Name the artifacts after the tag
        id: stage
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p out
          for apk in app/build/outputs/apk/release/*.apk; do
            base="$(basename "$apk")"
            case "$base" in
              *universal*) name="ParsV2R-${TAG:-dev}-Universal.apk" ;;
              *arm64-v8a*) name="ParsV2R-${TAG:-dev}-arm64-v8a.apk" ;;
              *armeabi-v7a*) name="ParsV2R-${TAG:-dev}-armeabi-v7a.apk" ;;
              *x86_64*) name="ParsV2R-${TAG:-dev}-x86_64.apk" ;;
              *) name="$base" ;;
            esac
            cp "$apk" "out/$name"
          done
          ( cd out && sha256sum *.apk > SHA256SUMS )
          ls -la out

      - name: Every APK is signed
        run: |
          set -o pipefail
          {
            echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
            SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            APKSIGNER="$(find "$SDK" -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
            echo "apksigner=${APKSIGNER:-not found}"
            if [ -z "$APKSIGNER" ]; then
              echo "no apksigner in the SDK, so signing cannot be verified" >&2
              exit 1
            fi
            fail=0
            for apk in out/*.apk; do
              echo "---- $(basename "$apk")"
              "$APKSIGNER" verify --verbose --print-certs "$apk" || fail=1
            done
            [ "$fail" -eq 0 ] || { echo "at least one APK did not verify" >&2; exit 1; }
          } 2>&1 | tee build-log.txt

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*

      - name: Save the log where it can be read
        if: failure()
        uses: ./.github/actions/publish-log
        with:
          name: release

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
