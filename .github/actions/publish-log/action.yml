name: Publish a failing build log
description: >
  Pushes the tail of a failed build onto an orphan ci-logs branch.
  Action logs are only reachable through a signed blob URL, which is not always available; a file
  in the repository always is. Keeping the failure where it can be read is the difference between
  fixing a build in one round trip and guessing at it for three.

inputs:
  name:
    description: Short label for the job, used in the file name
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        LOG_FILE="ci-logs/${{ inputs.name }}-${GITHUB_SHA::8}.log"

        {
          echo "job:    ${{ inputs.name }}"
          echo "commit: $GITHUB_SHA"
          echo "run:    $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "when:   $(date -u +%FT%TZ)"
          echo
          echo "---- last 400 lines ----"
          tail -n 400 build-log.txt 2>/dev/null || echo "(nothing was captured)"
          echo
          echo "---- gradle test reports ----"
          find . -name '*.txt' -path '*reports/tests*' -exec sh -c 'echo "== $1"; cat "$1"' _ {} \; 2>/dev/null | head -c 40000 || true
          find . -name 'TEST-*.xml' -path '*test-results*' -exec sh -c 'echo "== $1"; cat "$1"' _ {} \; 2>/dev/null | head -c 60000 || true
        } > /tmp/failure.log

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Two jobs can fail in the same run, so this races with itself. Keep whatever is
        # already on the branch and retry on rejection rather than forcing, or the second
        # job to finish quietly erases the first one's log -- which is the one worth reading.
        for attempt in 1 2 3 4 5; do
          rm -rf /tmp/logbranch
          if git clone -q --depth 1 --branch ci-logs "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" /tmp/logbranch 2>/dev/null; then
            :
          else
            mkdir -p /tmp/logbranch
            git -C /tmp/logbranch init -q -b ci-logs
            git -C /tmp/logbranch remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          fi
          git -C /tmp/logbranch config user.name "github-actions[bot]"
          git -C /tmp/logbranch config user.email "github-actions[bot]@users.noreply.github.com"
          git -C /tmp/logbranch config http.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"

          mkdir -p "/tmp/logbranch/$(dirname "$LOG_FILE")"
          cp /tmp/failure.log "/tmp/logbranch/$LOG_FILE"
          git -C /tmp/logbranch add "$LOG_FILE"
          git -C /tmp/logbranch commit -q -m "ci: ${{ inputs.name }} failed on ${GITHUB_SHA::8}"
          if git -C /tmp/logbranch push -q origin HEAD:ci-logs; then
            echo "log pushed to the ci-logs branch as $LOG_FILE"
            exit 0
          fi
          echo "push rejected, another job got there first; retrying ($attempt)"
          sleep $((attempt * 3))
        done
        echo "could not publish the log" >&2
        exit 1
